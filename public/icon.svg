<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3B0C1E"/>
      <stop offset="60%" stop-color="#240612"/>
      <stop offset="100%" stop-color="#14020A"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAF"/>
      <stop offset="50%" stop-color="#E88CA6"/>
      <stop offset="100%" stop-color="#B76E79"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with squircle radius -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#E8B4B8" stroke-width="3" opacity="0.3"/>
  
  <!-- Glowing Heart -->
  <g transform="translate(256, 235)" filter="url(#glow)">
    <path d="M 0, -40 
             C -60, -130, -180, -110, -180, 20 
             C -180, 110, -70, 170, 0, 230 
             C 70, 170, 180, 110, 180, 20 
             C 180, -110, 60, -130, 0, -40 Z" 
          fill="url(#heartGrad)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="140" cy="130" r="8" fill="#FFF0F3" opacity="0.8"/>
  <circle cx="370" cy="140" r="10" fill="#FFD700" opacity="0.9"/>
  <circle cx="390" cy="330" r="6" fill="#FFF0F3" opacity="0.6"/>

  <!-- Monogram text -->
  <text x="256" y="275" font-family="'Great Vibes', cursive, serif" font-size="76" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    Binita ♡
  </text>
</svg>
